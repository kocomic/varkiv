name: Bug report
description: Report a reproducible Varkiv defect without exposing private game-library data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach ROMs, BIOS, firmware, keys, saves, tokens, database files, or screenshots containing private paths. Security issues belong in GitHub Private Vulnerability Reporting, not a public issue.
  - type: input
    id: version
    attributes:
      label: Varkiv version
      description: Paste `varkiv version --json` or the exact image digest.
      placeholder: 0.1.0-preview.3 or ghcr.io/...@sha256:...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library and metadata
        - Import source
        - Package export
        - Save synchronization
        - Web player or web netplay
        - Android or device agent
        - Deployment, backup, or recovery
        - API or protocol
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic filenames and redact private identifiers.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/NAS, architecture, browser/client, deployment mode, platform, frontend, emulator and core versions where relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed ROM data, credentials, personal saves, private paths, and device identifiers.
          required: true
