name: Publish Docker Hub mirror

on:
  workflow_call:
    inputs:
      source_image:
        type: string
        required: true
      version:
        type: string
        required: true
      revision:
        type: string
        required: true
      tags:
        type: string
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Published release version to mirror or retry (without v)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  mirror:
    name: Copy the verified image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dockerhub-${{ github.repository }}-${{ contains(inputs.tags, ' edge') && 'edge' || inputs.version }}
      cancel-in-progress: false
    outputs:
      image_ref: ${{ steps.identity.outputs.image_ref }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the published image identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_IMAGE: ${{ inputs.source_image }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          TAGS: ${{ inputs.tags }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]+$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = false
            gh release download "v$VERSION" --pattern "varkiv-$VERSION-container-image.txt" --dir "$RUNNER_TEMP/source-release"
            SOURCE_IMAGE="$(cat "$RUNNER_TEMP/source-release/varkiv-$VERSION-container-image.txt")"
            REVISION="$(git rev-parse "v$VERSION^{commit}")"
            git merge-base --is-ancestor "$REVISION" origin/main
            TAGS="$VERSION"
          fi
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          expected_source="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$SOURCE_IMAGE" == "$expected_source"@sha256:* ]]
          digest="${SOURCE_IMAGE##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$SOURCE_IMAGE" = "$expected_source@$digest"
          target="docker.io/$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY##*/}"
          [[ "$target" =~ ^docker\.io/[a-z0-9._-]+/[a-z0-9._-]+$ ]]
          # Only the version or this exact commit's edge tags may be published.
          if [[ "$TAGS" != "$VERSION" && "$TAGS" != "sha-${REVISION:0:12} edge" ]]; then
            echo 'unexpected mirror tags' >&2
            exit 1
          fi
          {
            echo "source_image=$SOURCE_IMAGE"
            echo "target=$target"
            echo "image_ref=$target@$digest"
            echo "version=$VERSION"
            echo "revision=$REVISION"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Install registry copy tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo

      - name: Verify source platforms and application identity
        env:
          SOURCE_IMAGE: ${{ steps.identity.outputs.source_image }}
          VERSION: ${{ steps.identity.outputs.version }}
          REVISION: ${{ steps.identity.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          skopeo inspect --raw "docker://$SOURCE_IMAGE" | jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] |
            (index("linux/amd64") != null) and (index("linux/arm64") != null)'
          for arch in amd64 arm64; do
            skopeo inspect --config --override-os linux --override-arch "$arch" "docker://$SOURCE_IMAGE" |
              jq -e --arg version "$VERSION" --arg revision "$REVISION" \
                --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" '
                .config.Labels["org.opencontainers.image.version"] == $version and
                .config.Labels["org.opencontainers.image.revision"] == $revision and
                .config.Labels["org.opencontainers.image.source"] == $source'
          done

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy all manifests without rebuilding
        env:
          SOURCE_IMAGE: ${{ steps.identity.outputs.source_image }}
          TARGET_IMAGE: ${{ steps.identity.outputs.target }}
          TAGS: ${{ steps.identity.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a tags <<< "$TAGS"
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          ./scripts/mirror-container.sh --source "$SOURCE_IMAGE" --target "$TARGET_IMAGE" "${args[@]}"

      - name: Render Docker Hub deployment bundle
        env:
          IMAGE_REF: ${{ steps.identity.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir deployment
          ./scripts/render-container-deployment.sh --image "$IMAGE_REF" --out deployment/compose.yaml
          awk -v image="$IMAGE_REF" '/^VARKIV_IMAGE=/{print "VARKIV_IMAGE=" image; next} {print}' .env.ghcr.example > deployment/env.example
          printf '%s\n' "$IMAGE_REF" > deployment/IMAGE.txt
          (cd deployment && sha256sum compose.yaml env.example IMAGE.txt > SHA256SUMS)

      - name: Preserve Docker Hub deployment bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: varkiv-dockerhub-deployment-${{ github.run_id }}
          path: deployment/
          if-no-files-found: error
          retention-days: 30

  prove:
    name: Prove anonymous Docker Hub ${{ matrix.platform }} pull
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
    steps:
      - name: Check out verification code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Register ARM64 execution
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64

      - name: Verify public pull and executable version
        env:
          IMAGE_REF: ${{ needs.mirror.outputs.image_ref }}
          VERSION: ${{ needs.mirror.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: ./scripts/verify-anonymous-container.sh --image "$IMAGE_REF" --version "$VERSION" --platform "$PLATFORM"
