              $ref: '#/components/schemas/PortableRuntimeCatalog'
              description: Present for varkiv-launches.json v2; selected custom runtime definitions and the package profile are preview-token protected and committed atomically with selected games
    ImportPreview:
      type: object
      required: [parsed, preview_token, candidates, source_diagnostics]
      properties:
        parsed: {type: integer, minimum: 0}
        preview_token: {type: string, description: Opaque signed snapshot; server restart invalidates it}
        candidates: {type: array, items: {$ref: '#/components/schemas/ImportCandidate'}}
        source_diagnostics: {type: array, items: {$ref: '#/components/schemas/ImportSourceDiagnostic'}, description: "Aggregate source-state hints only; never includes filenames, paths, sizes, hashes, passwords, or executable tool instructions"}
    ImportSourceDiagnostic:
      type: object
      required: [code, count]
      additionalProperties: false
      properties:
        code: {type: string, enum: [wrapped_archives_detected, split_archives_detected, platform_wrapped_archives_detected, platform_split_archive_parts_detected, container_inspection_limited]}
        count: {type: integer, minimum: 1}
    ImportCommitResult:
      type: object
      required: [parsed, imported, skipped, failure_policy, rom_storage, media_storage]
      properties:
        parsed: {type: integer, minimum: 0}
        imported: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        failure_policy: {type: string, const: atomic}
        rom_storage: {type: string, enum: [reference, copy]}
        media_storage: {type: string, enum: [copy, reference, ignore]}
        rom_files_copied: {type: integer, minimum: 0}
        rom_bytes_copied: {type: integer, format: int64, minimum: 0}
        media_files_copied: {type: integer, minimum: 0}
        media_bytes_copied: {type: integer, format: int64, minimum: 0}
        scan: {$ref: '#/components/schemas/SourceScan'}
    LibrarySource:
      type: object
      required: [id, name, kind, source_adapter_id, platform, rom_storage_policy, media_storage_policy, enabled, last_scan_status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [rom_directory, pegasus, esde, varkiv]}
        source_adapter_id: {type: string}
        root_path: {type: string}
        metadata_path: {type: string}
        runtime_metadata_path: {type: string}
        platform: {type: string}
        metadata_locale: {type: string}
        rom_storage_policy: {type: string, enum: [reference, copy]}
        media_storage_policy: {type: string, enum: [copy, reference, ignore]}
        enabled: {type: boolean}
        last_scan_at: {type: string, format: date-time}
        last_scan_status: {type: string, enum: [never, scanning, ready, committed, failed, stale]}
        last_error: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SourceScan:
      type: object
      required: [id, source_id, status, requested_at, candidate_count, importable_count, missing_count, duplicate_count, conflict_count]
      properties:
        id: {type: string, format: uuid}
        source_id: {type: string, format: uuid}
        status: {type: string, enum: [scanning, ready, committed, failed, stale]}
        requested_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        candidate_count: {type: integer, minimum: 0}
        importable_count: {type: integer, minimum: 0}
        missing_count: {type: integer, minimum: 0}
        duplicate_count: {type: integer, minimum: 0}
        conflict_count: {type: integer, minimum: 0}
        failure_code: {type: string}
        failure_detail: {type: string}
    SourceScanPreview:
      type: object
      required: [scan, preview_token, candidates, source_diagnostics]
      properties:
        scan: {$ref: '#/components/schemas/SourceScan'}
        preview_token: {type: string, description: Opaque token; expires after 15 minutes and is not stored in plaintext}
        candidates: {type: array, items: {$ref: '#/components/schemas/ImportCandidate'}}
        source_diagnostics: {type: array, items: {$ref: '#/components/schemas/ImportSourceDiagnostic'}}
    PackageConfigTemplateInput:
      type: object
      required: [name, scope, output_path, body]
      properties:
        name: {type: string}
        scope: {type: string, enum: [package, platform, edition]}
        output_path: {type: string, description: Safe relative path ending in an allowed non-executable configuration extension}
        body: {type: string, maxLength: 65536, description: Inert text with simple scope-checked placeholders for profile/platform/game/edition/ROM and resolved device/driver/core/Android launch values; reviewed argv and executable hints are available only as JSON arrays; unavailable values are errors}
        sort_order: {type: integer}
    ConfigTemplatePreset:
      type: object
      required: [id, name, summary, contract_version, scope, output_path, body, targets, frontends, requires]
      properties:
        id: {type: string}
        name: {type: string}
        summary: {type: string}
        contract_version: {type: integer, minimum: 1}
        scope: {type: string, enum: [package, platform, edition]}
        output_path: {type: string, description: Safe package-relative configuration path copied into a PackageProfile}
        body: {type: string, description: Inert allowlisted-placeholder text copied into a PackageProfile}
        targets: {type: array, items: {type: string}}
        frontends: {type: array, items: {type: string, enum: [pegasus, es-de]}}
        requires: {type: array, items: {type: string}, description: Human-readable runtime prerequisites; planning still validates actual availability}
    PackageProfile:
      type: object
      required: [id, name, frontend, target, locale, file_mode, output_slug, enabled, builtin, templates, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        frontend: {type: string, enum: [pegasus, es-de]}
        target: {type: string}
        device_profile_id: {type: string}
        frontend_adapter_id: {type: string}
        locale: {type: string}
        file_mode: {type: string, enum: [copy, hardlink, reference], description: Reference emits metadata-only target-root-relative paths and does not copy or own ROM/media content}
        output_slug: {type: string}
        enabled: {type: boolean}
        builtin: {type: boolean, description: Application-owned starter profile; immutable through ordinary update and delete APIs}
        templates: {type: array, items: {$ref: '#/components/schemas/PackageConfigTemplateInput'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PortablePackageProfile:
      type: object
      required: [id, name, frontend, target, locale, file_mode, output_slug, enabled, templates]
      properties:
        id: {type: string}
        name: {type: string}
        frontend: {type: string, enum: [pegasus, es-de]}
        target: {type: string}
        device_profile_id: {type: string}
        frontend_adapter_id: {type: string}
        locale: {type: string}
        file_mode: {type: string, enum: [copy, hardlink, reference], description: Reference emits metadata-only target-root-relative paths and does not copy or own ROM/media content}
        output_slug: {type: string}
        enabled: {type: boolean, const: true}
        templates: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/PackageConfigTemplateInput'}}
    PackagePlanItem:
      type: object
      required: [kind, target, action]
      properties:
        kind: {type: string, enum: [rom, media, metadata, config, launch]}
        edition_id: {type: string}
        source: {type: string}
        target: {type: string}
        action: {type: string, enum: [copy, hardlink, reference, unchanged, generate, deduplicated, missing, conflict]}
        size: {type: integer, format: int64}
        sha256: {type: string}
        detail: {type: string}
    PackagePlan:
      type: object
      required: [id, profile_id, fingerprint, status, expires_at, plan]
      properties:
        id: {type: string, format: uuid}
        profile_id: {type: string}
        fingerprint: {type: string}
        status: {type: string, enum: [ready, built, stale, failed]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        plan:
          type: object
          required: [output, fingerprint, items, managed_paths, conflicts, warnings, estimated_write_bytes, space_checked]
          properties:
            output: {type: string, description: State-relative output path; absolute host paths are not exposed}
            fingerprint: {type: string}
            items: {type: array, items: {$ref: '#/components/schemas/PackagePlanItem'}}
            managed_paths: {type: array, items: {type: string}}
            conflicts: {type: array, items: {type: string}}
            warnings: {type: array, items: {type: string}}
            estimated_write_bytes: {type: integer, format: int64, minimum: 0, description: Conservative estimate including package-generation safety reserve}
            available_bytes: {type: integer, format: int64, minimum: 0, description: Available bytes on the output filesystem when space_checked is true}
            space_checked: {type: boolean}
    PackageRelease:
      type: object
      required: [id, profile_id, plan_id, status, output_slug, created_at, result]
      properties:
        id: {type: string, format: uuid}
        profile_id: {type: string}
        plan_id: {type: string, format: uuid}
        status: {type: string, enum: [succeeded, failed]}
        output_slug: {type: string}
        created_at: {type: string, format: date-time}
        result:
          oneOf:
            - {$ref: '#/components/schemas/PackageBuildResult'}
            - {$ref: '#/components/schemas/PackageFailureResult'}
    PackageBuildResult:
      type: object
      required: [output, exported_editions, copied_files, linked_files, unchanged_files, missing_files, warnings, manifest_files]
      properties:
        output: {type: string, description: State-relative output path; absolute host paths are not exposed}
        exported_editions: {type: integer, minimum: 0}
        copied_files: {type: integer, minimum: 0}
        linked_files: {type: integer, minimum: 0}
        unchanged_files: {type: integer, minimum: 0}
        missing_files: {type: integer, minimum: 0}
        warnings: {type: array, items: {type: string}}
        manifest_files: {type: integer, minimum: 0}
        recovery_snapshot: {type: string, description: State-relative locator for an independent pre-update snapshot containing only replaced managed files; omitted for a fresh output and never stored inside the portable package}
    PackageFailureResult:
      type: object
      required: [code, error]
      properties:
        code: {type: string, enum: [package_build_failed, unmanaged_target_conflict]}
        error: {type: string, description: Sanitized failure message without host paths}
    SupportLevel:
      type: string
      enum: [catalogued, package-tested, hardware-tested, sync-tested]
      description: hardware-tested and sync-tested claims require structured passing evidence with device, software_version, verified_at, scope, and scenarios
    SupportEvidence:
      type: object
      additionalProperties: true
      description: Free-form notes for lower levels; hardware/sync claims require all declared properties and a passed result
      properties:
        scope: {type: string, enum: [fixture, hardware, sync]}
        device: {type: string}
        software_version: {type: string}
        verified_at: {type: string, description: YYYY-MM-DD or RFC3339}
        result: {type: string, enum: [passed]}
        scenarios: {type: array, minItems: 1, items: {type: string}}
    SourceAdapter:
      type: object
      required: [id, name, format, handler, contract_version, capabilities, support_level, evidence, builtin, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        format: {type: string, description: Stable external format or specialization slug}
        handler: {type: string, enum: [rom_directory, pegasus, esde, varkiv], description: Audited parser compiled into the service; adapters never load executable code}
        contract_version: {type: integer, minimum: 1}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        support_level: {$ref: '#/components/schemas/SupportLevel'}
        evidence: {$ref: '#/components/schemas/SupportEvidence'}
        builtin: {type: boolean}
        enabled: {type: boolean}
    FrontendAdapter:
      type: object
      required: [id, name, format, handler, contract_version, capabilities, support_level, evidence, builtin, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        format: {type: string, description: Stable external format or specialization slug}
        handler: {type: string, enum: ['', pegasus, es-de], description: Audited exporter compiled into the service; an empty value is retained only for migrated legacy catalog entries and cannot be used by a PackageProfile}
        contract_version: {type: integer, minimum: 1}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        support_level: {$ref: '#/components/schemas/SupportLevel'}
        evidence: {$ref: '#/components/schemas/SupportEvidence'}
        builtin: {type: boolean}
        enabled: {type: boolean}
    DeviceProfile:
      type: object
      required: [id, name, contract_version, target, os_family, path_style, case_sensitive, max_path, supports_hardlink, supports_hooks, paths, support_level, evidence, builtin, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        contract_version: {type: integer, minimum: 1}
        target: {type: string}
        os_family: {type: string}
        distribution: {type: string}
        architecture: {type: string}
        path_style: {type: string, enum: [posix, windows, android-uri]}
        case_sensitive: {type: boolean}
        max_path: {type: integer, minimum: 64}
        illegal_characters: {type: string}
        supports_hardlink: {type: boolean}
        supports_hooks: {type: boolean}
        default_frontend_id: {type: string}
        paths:
          type: object
          description: Portable target-relative templates only; real device absolute roots belong in the private Agent configuration
          additionalProperties: false
          properties:
            config_dir: {type: string}
            save_dir: {type: string}
            rom_dir: {type: string}
            core_dir: {type: string}
            emulator_dir: {type: string}
        support_level: {$ref: '#/components/schemas/SupportLevel'}
        evidence: {$ref: '#/components/schemas/SupportEvidence'}
        builtin: {type: boolean}
        enabled: {type: boolean}
    DriverLaunchSpec:
      type: object
      required: [arguments]
      properties:
        requires_core: {type: boolean}
        executables: {type: object, additionalProperties: {type: array, items: {type: string}}}
        android_package: {type: string}
        android_activity: {type: string}
        android_intent: {$ref: '#/components/schemas/AndroidIntentSpec'}
        arguments: {type: array, maxItems: 32, items: {type: string, maxLength: 2048}, description: Argv entries with allowlisted variables; never a shell command}
    AndroidIntentSpec:
      type: object
      required: [package]
      description: Declarative explicit Android Intent. It cannot represent or execute a shell command; the paired client renders only allowlisted local variables.
      properties:
        action: {type: string, default: android.intent.action.VIEW}
        package: {type: string}
        package_candidates:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Ordered fallback application IDs for official package variants; the Android client selects the first installed package without using an implicit intent.
          items: {type: string}
        activity: {type: string}
        data: {type: string}
        mime_type: {type: string}
        categories: {type: array, items: {type: string}}
        string_extras: {type: object, additionalProperties: {type: string}}
        boolean_extras: {type: object, additionalProperties: {type: boolean}}
        flags: {type: array, items: {type: string, enum: [grant-read-uri, grant-write-uri, new-task, clear-top]}}
    DriverSaveSpec:
      type: object
      required: [scope, layout, patterns, refresh, portability]
      properties:
        scope: {type: string, enum: [game, platform, container]}
        layout: {type: string}
        patterns: {type: array, items: {type: string}}
        scope_by_platform: {type: object, additionalProperties: {type: string, enum: [game, platform, container]}}
        layout_by_platform: {type: object, additionalProperties: {type: string}}
        patterns_by_platform: {type: object, additionalProperties: {type: array, items: {type: string}}}
        refresh: {type: string}
        portability: {type: string}
    EmulatorDriver:
      type: object
      required: [id, name, family, contract_version, platforms, targets, launch, save, config_paths, support_level, evidence, builtin, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        family: {type: string}
        contract_version: {type: integer, minimum: 1}
        platforms: {type: array, items: {type: string}}
        targets: {type: array, items: {type: string}}
        launch: {$ref: '#/components/schemas/DriverLaunchSpec'}
        save: {$ref: '#/components/schemas/DriverSaveSpec'}
        config_paths: {type: object, additionalProperties: {type: string}}
        support_level: {$ref: '#/components/schemas/SupportLevel'}
        evidence: {$ref: '#/components/schemas/SupportEvidence'}
        builtin: {type: boolean}
        enabled: {type: boolean}
    RetroArchCore:
      type: object
      required: [id, name, contract_version, library_names, platforms, support_level, evidence, builtin, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        contract_version: {type: integer, minimum: 1}
        library_names: {type: array, minItems: 1, items: {type: string}}
        platforms: {type: array, minItems: 1, items: {type: string}}
        support_level: {$ref: '#/components/schemas/SupportLevel'}
        evidence: {$ref: '#/components/schemas/SupportEvidence'}
        builtin: {type: boolean}
        enabled: {type: boolean}
    PortableFrontendAdapter:
      type: object
      required: [id, name, format, handler, contract_version, support_level, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        format: {type: string}
        handler: {type: string, enum: ['', pegasus, es-de], description: Audited built-in exporter; empty is accepted only for legacy metadata that is not referenced by a portable PackageProfile}
        contract_version: {type: integer, minimum: 1}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        support_level: {type: string, const: catalogued}
        enabled: {type: boolean, const: true}
    PortableDeviceProfile:
      type: object
      required: [id, name, contract_version, target, os_family, path_style, max_path, support_level, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        contract_version: {type: integer, minimum: 1}
        target: {type: string}
        os_family: {type: string}
        distribution: {type: string}
        architecture: {type: string}
        path_style: {type: string, enum: [posix, windows, android-uri]}
        case_sensitive: {type: boolean}
        max_path: {type: integer, minimum: 64}
        illegal_characters: {type: string}
        supports_hardlink: {type: boolean}
        supports_hooks: {type: boolean}
        default_frontend_id: {type: string}
        paths: {type: object, additionalProperties: {type: string}, description: Portable relative target paths only}
        support_level: {type: string, const: catalogued}
        enabled: {type: boolean, const: true}
    PortableEmulatorDriver:
      type: object
      required: [id, name, family, contract_version, platforms, targets, launch, save, support_level, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        family: {type: string}
        contract_version: {type: integer, minimum: 1}
        platforms: {type: array, minItems: 1, items: {type: string}}
        targets: {type: array, minItems: 1, items: {type: string}}
        launch: {$ref: '#/components/schemas/DriverLaunchSpec'}
        save: {$ref: '#/components/schemas/DriverSaveSpec'}
        config_paths: {type: object, additionalProperties: {type: string}}
        support_level: {type: string, const: catalogued}
        enabled: {type: boolean, const: true}
    PortableRetroArchCore:
      type: object
      required: [id, name, contract_version, library_names, platforms, support_level, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        contract_version: {type: integer, minimum: 1}
        library_names: {type: array, minItems: 1, items: {type: string}}
        platforms: {type: array, minItems: 1, items: {type: string}}
        support_level: {type: string, const: catalogued}
        enabled: {type: boolean, const: true}
    PortableRuntimeCatalog:
      type: object
      description: Declarative, non-executable runtime definitions. Built-in ownership, timestamps, local enablement, hardware evidence, secrets, and absolute device paths are excluded.
      properties:
        frontend_adapters: {type: array, items: {$ref: '#/components/schemas/PortableFrontendAdapter'}}
        device_profiles: {type: array, items: {$ref: '#/components/schemas/PortableDeviceProfile'}}
        emulator_drivers: {type: array, items: {$ref: '#/components/schemas/PortableEmulatorDriver'}}
        retroarch_cores: {type: array, items: {$ref: '#/components/schemas/PortableRetroArchCore'}}
        package_profile: {$ref: '#/components/schemas/PortablePackageProfile'}
    CoreMapping:
      type: object
      required: [id, scope_type, platform_id, core_id, priority, builtin]
      properties:
        id: {type: string}
        scope_type: {type: string, enum: [global, platform, device_profile, edition]}
        scope_key: {type: string}
        platform_id: {type: string}
        core_id: {type: string}
        priority: {type: integer}
        notes: {type: string}
        builtin: {type: boolean}
    CoreResolution:
      type: object
      required: [platform_id, resolution]
      properties:
        platform_id: {type: string}
        edition_id: {type: string}
        device_profile_id: {type: string}
        mapping: {$ref: '#/components/schemas/CoreMapping'}
        core: {$ref: '#/components/schemas/RetroArchCore'}
        resolution: {type: string, enum: [unmapped, global, platform, device_profile, edition, launch_binding]}
    LaunchBinding:
      type: object
      required: [id, edition_id, driver_id, arguments, enabled]
      properties:
        id: {type: string}
        edition_id: {type: string}
        device_profile_id: {type: string}
        driver_id: {type: string}
        frontend_adapter_id: {type: string}
        core_id: {type: string}
        arguments: {type: array, maxItems: 32, items: {type: string}}
        enabled: {type: boolean}
    NewLaunchBinding:
      type: object
      required: [driver_id]
      properties:
        edition_id: {type: string, description: Optional for hint application; the hint Edition is authoritative}
        device_profile_id: {type: string}
        driver_id: {type: string}
        frontend_adapter_id: {type: string}
        core_id: {type: string}
        arguments: {type: array, maxItems: 32, items: {type: string}, description: Declarative argv templates; never shell text}
        enabled: {type: boolean}
    WebEmulationStatus:
      type: object
      additionalProperties: false
      required: [available, platform_id, edition_id, save_support, input_support, gamepad_mapping]
      properties:
        available: {type: boolean}
        reason: {type: string, enum: [not_configured, platform_not_supported, rom_unavailable, artifact_not_supported, rom_format_invalid]}
        platform_id: {type: string}
        core: {type: string}
        driver_id: {type: string}
        edition_id: {type: string}
        artifact_id: {type: string}
        rom_size: {type: integer, format: int64, minimum: 0, maximum: 134217728}
        save_support: {type: string, enum: [automatic-when-core-emits], description: Browser saves are synchronized into a core-isolated stream only when the selected core emits a persistent save file}
        input_support: {type: array, uniqueItems: true, items: {type: string, enum: [keyboard, gamepad, touch]}}
        gamepad_mapping: {type: string, const: user-configurable, description: Browser discovery is automatic; physical button mapping remains configurable in the EmulatorJS controls panel}
    WebEmulatorReadiness:
      type: object
      additionalProperties: false
      required: [enabled, mode, same_origin, integrity_verified, assets_verified, bytes_verified, supported_platforms, supported_extensions, platform_capabilities]
      properties:
        enabled: {type: boolean}
        mode: {type: string, enum: [disabled, external-unverified, self-hosted-verified]}
        same_origin: {type: boolean}
        integrity_verified: {type: boolean}
        emulatorjs_version: {type: string, const: 4.2.3}
        assets_verified: {type: integer, minimum: 0}
        bytes_verified: {type: integer, format: int64, minimum: 0}
        supported_platforms: {type: array, uniqueItems: true, items: {type: string, enum: ['2600', gb, gba, gbc, gamegear, mastersystem, megadrive, n64, nes, snes]}}
        supported_extensions: {type: array, uniqueItems: true, items: {type: string, enum: [.a26, .bin, .bs, .fig, .gb, .gba, .gbc, .gen, .gg, .md, .n64, .nes, .sfc, .smc, .sms, .smd, .unf, .unif, .v64, .z64]}}
        platform_capabilities: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/WebEmulatorPlatformCapability'}}
    WebEmulatorPlatformCapability:
      type: object
      additionalProperties: false
      required: [platform_id, core, extensions, minimum_rom_bytes]
      properties:
        platform_id: {type: string, enum: ['2600', gb, gba, gbc, gamegear, mastersystem, megadrive, n64, nes, snes]}
        core: {type: string, enum: [fceumm, gambatte, genesis_plus_gx, mgba, mupen64plus_next, smsplus, snes9x, stella2014]}
        extensions: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [.a26, .bin, .bs, .fig, .gb, .gba, .gbc, .gen, .gg, .md, .n64, .nes, .sfc, .smc, .sms, .smd, .unf, .unif, .v64, .z64]}}
        minimum_rom_bytes: {type: integer, format: int64, minimum: 1, maximum: 134217728, description: Conservative structural lower bound used to hide obvious placeholders; session creation additionally validates required cartridge headers}
    NewWebEmulationSession:
      type: object
      additionalProperties: false
      required: [edition_id]
      properties:
        edition_id: {type: string}
        locale: {type: string, enum: [zh-CN, zh-TW, ja, en]}
    WebEmulationSession:
      type: object
      additionalProperties: false
      required: [status, player_url, expires_at, asset_source]
      properties:
        status: {$ref: '#/components/schemas/WebEmulationStatus'}
        player_url: {type: string, pattern: '^/play/'}
        expires_at: {type: string, format: date-time}
        asset_source: {type: string, enum: [self-hosted, external]}
    WebNetplayReadiness:
      type: object
      additionalProperties: false
      required: [enabled, experimental, signal_ready, same_origin_signal, asset_mode, integrity_verified, profile_id, supported_platforms, platform_capabilities, save_policy, ice_server_count, assets_verified, bytes_verified, runtime]
      properties:
        enabled: {type: boolean}
        experimental: {type: boolean, const: true}
        signal_ready: {type: boolean}
        same_origin_signal: {type: boolean, const: true}
        asset_mode: {type: string, enum: [disabled, external-unverified, self-hosted-verified]}
        integrity_verified: {type: boolean}
        emulatorjs_version: {type: string, const: 4.3.0-pre}
        profile_id: {type: string, const: emulatorjs-webrtc-v1}
        supported_platforms: {type: array, items: {type: string, const: nes}}
        platform_capabilities:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [platform_id, core, extensions, minimum_rom_bytes, maximum_rom_bytes]
            properties:
              platform_id: {type: string, const: nes}
              core: {type: string, const: fceumm}
              extensions: {type: array, minItems: 3, maxItems: 3, uniqueItems: true, items: {type: string, enum: [.nes, .unf, .unif]}}
              minimum_rom_bytes: {type: integer, format: int64, const: 64}
              maximum_rom_bytes: {type: integer, format: int64, const: 134217728}
        save_policy: {type: string, const: no-persist}
        ice_server_count: {type: integer, minimum: 0, maximum: 8}
        assets_verified: {type: integer, minimum: 0}
        bytes_verified: {type: integer, format: int64, minimum: 0}
        runtime: {$ref: '#/components/schemas/WebNetplayRuntimeIdentity'}
    WebNetplayRuntimeIdentity:
      type: object
      additionalProperties: false
      required: [emulator, version, core, core_version]
      properties:
        emulator: {type: string, const: emulatorjs}
        version: {type: string, const: 4.3.0-pre}
        core: {type: string, const: fceumm}
        core_version: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    NewWebNetplaySession:
      type: object
      additionalProperties: false
      required: [edition_id, client_id, display_name]
      properties:
        edition_id: {type: string}
        locale: {type: string, enum: [zh-CN, zh-TW, ja, en]}
        client_id: {type: string, maxLength: 128}
        display_name: {type: string, maxLength: 20}
    JoinWebNetplaySession:
      allOf:
        - {$ref: '#/components/schemas/NewWebNetplaySession'}
        - type: object
          required: [invite_code]
          properties:
            invite_code: {type: string, pattern: '^[0-9a-f]{32}\.[0-9a-f]{64}$'}
    WebNetplaySession:
      type: object
      additionalProperties: false
      required: [session, player_url, role, expires_at]
      properties:
        session:
          type: object
          required: [id, protocol_version, profile_id, state, content, runtime, transport, save_policy, participants, created_at, expires_at]
          properties:
            id: {type: string, pattern: '^[0-9a-f]{32}$'}
            protocol_version: {type: string, const: v1}
            profile_id: {type: string, const: emulatorjs-webrtc-v1}
            state: {type: string, enum: [waiting, ready, closed]}
            content: {type: object, required: [sha256, size, platform], properties: {sha256: {type: string, pattern: '^[0-9a-f]{64}$'}, size: {type: integer, format: int64, minimum: 1}, platform: {type: string, const: nes}}}
            runtime: {$ref: '#/components/schemas/WebNetplayRuntimeIdentity'}
            transport: {type: string, const: direct}
            save_policy: {type: string, const: no-persist}
            participants: {type: array, minItems: 1, maxItems: 2, items: {type: object}}
            created_at: {type: string, format: date-time}
            expires_at: {type: string, format: date-time}
        invite_code: {type: string, pattern: '^[0-9a-f]{32}\.[0-9a-f]{64}$', description: Returned only when the host creates the room}
        player_url: {type: string, pattern: '^/play-netplay/'}
        role: {type: string, enum: [host, guest]}
        expires_at: {type: string, format: date-time}
    RuntimeImportHint:
      type: object
      required: [id, edition_id, source_kind, source_format, arguments, trust, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        edition_id: {type: string}
        source_kind: {type: string, enum: [structured-sidecar, pegasus-command, esde-system]}
        source_format: {type: string}
        device_profile_id: {type: string}
        frontend_adapter_id: {type: string}
        driver_id: {type: string}
        core_id: {type: string}
        arguments: {type: array, maxItems: 32, items: {type: string}}
        raw_command: {type: string, maxLength: 8192, description: Inert source text for review; never executed}
        trust: {type: string, enum: [structured, untrusted]}
        status: {type: string, enum: [pending, applied, dismissed]}
        source_ref: {type: string, description: Portable path inside the configured library root}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RuntimeHintApplication:
      type: object
      required: [hint, binding]
      properties:
        hint: {$ref: '#/components/schemas/RuntimeImportHint'}
        binding: {$ref: '#/components/schemas/LaunchBinding'}
    RuntimeHintBatchRequest:
      type: object
      additionalProperties: false
      required: [hint_ids, device_profile_id, driver_id]
      properties:
        hint_ids: {type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: {type: string, format: uuid}}
        device_profile_id: {type: string}
        driver_id: {type: string}
        frontend_adapter_id: {type: string}
        core_id: {type: string}
        arguments: {type: array, maxItems: 32, items: {type: string}, description: Declarative argv templates; raw imported commands are excluded}
    RuntimeHintBatchCommit:
      type: object
      additionalProperties: false
      required: [hint_ids, device_profile_id, driver_id, preview_token]
      properties:
        hint_ids: {type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: {type: string, format: uuid}}
        device_profile_id: {type: string}
        driver_id: {type: string}
        frontend_adapter_id: {type: string}
        core_id: {type: string}
        arguments: {type: array, maxItems: 32, items: {type: string}, description: Declarative argv templates; raw imported commands are excluded}
        preview_token: {type: string, minLength: 1}
    RuntimeHintBatchPreview:
      type: object
      additionalProperties: false
      required: [preview_token, count, platform_id, device_profile_id, driver_id, arguments, failure_policy, raw_commands_executed]
      properties:
        preview_token: {type: string, minLength: 1, description: "HMAC over the exact hint, Edition, and runtime-definition snapshot"}
        count: {type: integer, minimum: 1, maximum: 500}
        platform_id: {type: string}
        device_profile_id: {type: string}
        driver_id: {type: string}
        frontend_adapter_id: {type: string}
        core_id: {type: string}
        arguments: {type: array, maxItems: 32, items: {type: string}}
        failure_policy: {type: string, const: atomic}
        raw_commands_executed: {type: boolean, const: false}
    RuntimeHintBatchResult:
      type: object
      additionalProperties: false
      required: [applied, applications]
      properties:
        applied: {type: integer, minimum: 1, maximum: 500}
        applications: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/RuntimeHintApplication'}}
    LaunchResolution:
      type: object
      required: [edition_id, platform_id, rom_path, binding, device_profile, driver, arguments, executable_hints, warnings]
      properties:
        edition_id: {type: string}
        platform_id: {type: string}
        rom_path: {type: string, description: Portable library-relative ROM path}
        binding: {$ref: '#/components/schemas/LaunchBinding'}
        device_profile: {$ref: '#/components/schemas/DeviceProfile'}
        frontend_adapter: {$ref: '#/components/schemas/FrontendAdapter'}
        driver: {$ref: '#/components/schemas/EmulatorDriver'}
        core_resolution: {$ref: '#/components/schemas/CoreResolution'}
        arguments: {type: array, items: {type: string}, description: Fully rendered argv entries; never a shell command}
        executable_hints: {type: array, items: {type: string}}
        android_package: {type: string}
        android_activity: {type: string}
        warnings: {type: array, items: {type: string}}
    Platform:
      type: object
      required: [id, name, name_zh, vendor, category, aliases, extensions, esde_systems, bios, runtime, builtin, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        name_zh: {type: string}
        vendor: {type: string}
        category: {type: string, enum: [console, handheld, arcade, computer]}
        aliases: {type: array, items: {type: string}}
        extensions: {type: array, items: {type: string}}
        esde_systems: {type: array, items: {type: string}}
        bios: {type: string, enum: [none, optional, required, varies]}
        runtime: {type: string, enum: [web, web_experimental, native]}
        suggested_emulators: {type: object, additionalProperties: {type: array, items: {type: string}}}
        builtin: {type: boolean}
        enabled: {type: boolean}
    NewCustomPlatform:
      type: object
      required: [name, category]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        name_zh: {type: string, maxLength: 120}
        vendor: {type: string, maxLength: 120, default: Custom}
        category: {type: string, enum: [console, handheld, arcade, computer]}
        aliases: {type: array, maxItems: 64, items: {type: string}}
        extensions: {type: array, maxItems: 64, items: {type: string, description: Dot-prefixed suffix or directory}}
        esde_systems: {type: array, maxItems: 64, items: {type: string}}
        bios: {type: string, enum: [none, optional, required, varies], default: varies}
        runtime: {type: string, enum: [web, web_experimental, native], default: native}
        suggested_emulators: {type: object, additionalProperties: {type: array, items: {type: string}}}
        enabled: {type: boolean, default: true}
    CustomPlatform:
      allOf:
        - {$ref: '#/components/schemas/Platform'}
        - type: object
          required: [created_at, updated_at]
          properties:
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    Artifact:
      type: object
      required: [id, edition_id, path, storage_kind, role, size, missing]
      properties:
        id: {type: string, format: uuid}
        edition_id: {type: string, format: uuid}
        path: {type: string}
        storage_kind: {type: string, enum: [library, managed]}
        source_path: {type: string}
        original_name: {type: string}
        role: {type: string, enum: [rom, disc, executable, patch, dlc, update, other]}
        disc_index: {type: integer, minimum: 0, maximum: 64}
        size: {type: integer, format: int64, minimum: 0}
        sha256: {type: string}
        missing: {type: boolean}
    Device:
      type: object
      required: [id, name, os_family, status, capabilities, created_at, updated_at, last_seen_at]
      properties:
        id: {type: string}
        name: {type: string}
        device_profile_id: {type: string}
        os_family: {type: string}
        distribution: {type: string}
        architecture: {type: string}
        agent_version: {type: string}
        status: {type: string, enum: [active, offline, revoked]}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    PairingCodeRequest:
      type: object
      required: [requested_device]
      properties:
        expires_in_seconds: {type: integer, minimum: 120, maximum: 1800, default: 600}
        requested_device:
          type: object
          additionalProperties: false
          required: [device_profile_id]
          properties:
            device_profile_id: {type: string, minLength: 1, description: Existing enabled profile selected by the administrator and bound to this code.}
    PairingCode:
      type: object
      required: [id, code, expires_at, requested_device]
      properties:
        id: {type: string}
        code: {type: string, pattern: '^[A-Z2-9]{5}-[A-Z2-9]{5}$', description: Displayed once; only its SHA-256 hash is persisted.}
        expires_at: {type: string, format: date-time}
        requested_device: {type: object, additionalProperties: true}
    PairingRedeemRequest:
      type: object
      required: [code, device]
      properties:
        code: {type: string}
        device:
          type: object
          required: [name, os_family]
          properties:
            name: {type: string}
            device_profile_id: {type: string, description: Optional legacy assertion. New clients omit it; when present it must exactly match the administrator-bound profile and can never select or replace that profile.}
            os_family: {type: string}
            distribution: {type: string}
            architecture: {type: string}
            agent_version: {type: string}
            capabilities: {type: object, additionalProperties: {type: boolean}}
    PairingRedeemResponse:
      type: object
      required: [device, device_target, access_token, token_type, expires_at, scopes]
      properties:
        device: {$ref: '#/components/schemas/Device'}
        device_target: {type: string, description: Stable target of the enabled DeviceProfile selected by the administrator; empty only for legacy profile-less pairing.}
        access_token: {type: string, writeOnly: true, description: Returned once; the server persists only a SHA-256 hash.}
        token_type: {type: string, const: Bearer}
        expires_at: {type: string, format: date-time}
        scopes: {type: array, items: {type: string, enum: ['sync:read', 'sync:write', 'device:heartbeat']}}
    HeartbeatRequest:
      type: object
      properties:
        capabilities:
          type: object
          description: Only the documented runtime probe boolean keys are accepted; unknown keys are ignored.
          additionalProperties: {type: boolean}
        runtime_attestations:
          type: array
          maxItems: 128
          description: Complete current snapshot of identities requested for this device OS and architecture. Omitted prior identities are revoked atomically; an identity requested only for another platform is rejected; no host path, SAF URI, or basename is accepted.
          items: {$ref: '#/components/schemas/RuntimeAttestationReport'}
    RuntimeAttestationReport:
      type: object
      additionalProperties: false
      required: [kind, runtime_id, contract_version, sha256, size]
      properties:
        kind: {type: string, enum: [driver, core]}
        runtime_id: {type: string}
        contract_version: {type: integer, minimum: 1}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        size: {type: integer, format: int64, minimum: 1, maximum: 536870912}
    RuntimeAttestationRequirement:
      type: object
      additionalProperties: false
      description: Exact runtime identity requested only when an enabled compatibility member matches the authenticated device OS and architecture.
      required: [kind, runtime_id, contract_version]
      properties:
        kind: {type: string, enum: [driver, core]}
        runtime_id: {type: string}
        contract_version: {type: integer, minimum: 1}
    RuntimeAttestation:
      allOf:
        - {$ref: '#/components/schemas/RuntimeAttestationReport'}
        - type: object
          required: [device_id, observed_at]
          properties:
            device_id: {type: string}
            observed_at: {type: string, format: date-time}
    SaveCompatibilityMember:
      type: object
      additionalProperties: false
      required: [group_id, driver_id, runtime_kind, driver_contract_version]
      properties:
        group_id: {type: string}
        driver_id: {type: string}
        core_id: {type: string}
        runtime_kind: {type: string, enum: [server, device]}
        driver_contract_version: {type: integer, minimum: 1}
        core_contract_version: {type: integer, minimum: 1}
        os_family: {type: string}
        architecture: {type: string}
        driver_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        driver_size: {type: integer, format: int64, minimum: 1}
        core_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        core_size: {type: integer, format: int64, minimum: 1}
    SaveCompatibilityGroup:
      type: object
      additionalProperties: false
      required: [id, name, format, contract_version, evidence, members, builtin, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        format: {type: string}
        contract_version: {type: integer, minimum: 1}
        evidence: {type: object, additionalProperties: true}
        members: {type: array, minItems: 2, items: {$ref: '#/components/schemas/SaveCompatibilityMember'}}
        builtin: {type: boolean}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SaveStreamEdition:
      type: object
      required: [edition_id, compatibility, created_at]
      properties:
        edition_id: {type: string}
        compatibility: {type: string, enum: [native, verified, manual]}
        created_at: {type: string, format: date-time}
    SaveStream:
      type: object
      required: [id, namespace, owner_type, owner_key, driver_id, portability, editions, created_at, updated_at]
      properties:
        id: {type: string}
        namespace: {type: string}
        owner_type: {type: string, enum: [edition, platform, container]}
        owner_key: {type: string}
        driver_id: {type: string}
        portability: {type: string, enum: [portable, core-dependent, driver-dependent, device-dependent]}
        compatibility_group_id: {type: string, description: Versioned evidence-backed format group; absent for isolated streams.}
        editions: {type: array, items: {$ref: '#/components/schemas/SaveStreamEdition'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NewSaveStream:
      type: object
      required: [owner_type, owner_key, driver_id, edition_ids]
      properties:
        namespace: {type: string}
        owner_type: {type: string, enum: [edition, platform, container]}
        owner_key: {type: string}
        driver_id: {type: string}
        portability: {type: string, enum: [portable, core-dependent, driver-dependent, device-dependent], default: driver-dependent}
        compatibility_group_id: {type: string, description: Optional exact compatibility group. Built-in Web streams assign this server-side.}
        edition_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        compatibility: {type: string, enum: [native, verified, manual], default: native}
    SaveFile:
      type: object
      required: [id, revision_id, logical_path, checksum, size]
      properties:
        id: {type: string}
        revision_id: {type: string}
        logical_path: {type: string, description: Portable relative path; server blob paths are never exposed.}
        checksum: {type: string, pattern: '^[a-f0-9]{64}$'}
        size: {type: integer, format: int64, minimum: 0}
        mtime_ns: {type: integer, format: int64}
        mode: {type: integer, format: int64}
    SaveRevision:
      type: object
      required: [id, stream_id, content_hash, total_size, file_count, status, files, device_id, created_at]
      properties:
        id: {type: string}
        stream_id: {type: string}
        device_id: {type: string}
        parent_revision_id: {type: string}
        content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        total_size: {type: integer, format: int64, minimum: 0}
        file_count: {type: integer, minimum: 1, maximum: 4096}
        status: {type: string, enum: [current, superseded, conflict, quarantined]}
        files: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SaveFile'}}
        created_at: {type: string, format: date-time}
    SaveBinding:
      type: object
      required: [id, stream_id, edition_id, driver_id, local_paths, discovery, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        stream_id: {type: string}
        edition_id: {type: string}
        device_profile_id: {type: string}
        driver_id: {type: string}
        core_id: {type: string}
        local_paths: {type: array, minItems: 1, maxItems: 32, items: {type: string}, description: Allowlisted templates resolved only by Device Agent. Edition identity placeholders require the corresponding non-empty metadata; split title-ID placeholders require exactly 16 hexadecimal digits.}
        discovery: {type: object, additionalProperties: true}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NewSaveBinding:
      type: object
      required: [edition_id, driver_id, local_paths]
      properties:
        stream_id: {type: string, description: Ignored by the atomic setup endpoint and assigned from the new stream.}
        edition_id: {type: string}
        device_profile_id: {type: string}
        driver_id: {type: string}
        core_id: {type: string, description: Required when a binding joins an exact cross-driver RetroArch compatibility member.}
        local_paths: {type: array, minItems: 1, maxItems: 32, items: {type: string}, description: Identity-dependent templates fail before any binding or stream write when the Edition metadata is absent or invalid.}
        discovery: {type: object, additionalProperties: true}
        enabled: {type: boolean, default: true}
    SaveSetup:
      type: object
      required: [stream, binding]
      properties:
        stream: {$ref: '#/components/schemas/SaveStream'}
        binding: {$ref: '#/components/schemas/SaveBinding'}
    InventoryItem:
      type: object
      required: [id, session_id, client_item_id, platform_id, size, match_status, created_at]
      properties:
        id: {type: string}
        session_id: {type: string}
        client_item_id: {type: string, description: Opaque client-local identity; never an absolute path.}
        platform_id: {type: string}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        serial: {type: string}
        product_code: {type: string}
        title_id: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        match_status: {type: string, enum: [matched, ambiguous, unmatched]}
        matched_edition_id: {type: string}
        match_method: {type: string, enum: [sha256, serial, product_code, title_id, confirmed_sha256, confirmed_serial, confirmed_product_code, confirmed_title_id, '']}
        created_at: {type: string, format: date-time}
    InventoryMatchCandidate:
      type: object
      required: [edition_id, game_id, game_title, edition_title, edition_type, platform_id]
      properties:
        edition_id: {type: string}
        game_id: {type: string}
        game_title: {type: string}
        edition_title: {type: string}
        edition_type: {type: string}
        platform_id: {type: string}
    InventoryMatchReview:
      type: object
      description: Privacy-minimized administrator review; local ROM names, paths, identifiers, and hashes are deliberately absent.
      required: [session_id, inventory_item_id, device_name, platform_id, match_method, size, candidates]
      properties:
        session_id: {type: string}
        inventory_item_id: {type: string, description: Opaque server-side inventory row identifier.}
        device_name: {type: string}
        platform_id: {type: string}
        match_method: {type: string, enum: [serial, product_code, title_id]}
        size: {type: integer, format: int64, minimum: 0}
        candidates: {type: array, minItems: 2, items: {$ref: '#/components/schemas/InventoryMatchCandidate'}}
    InventoryMatchPreviewRequest:
      type: object
      additionalProperties: false
      required: [session_id, inventory_item_id, edition_id]
      properties:
        session_id: {type: string}
