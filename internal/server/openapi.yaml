      tags: [Runtime]
      summary: Create a short-lived browser-play session for one Edition
      description: Verifies the selected ROM against its recorded size and SHA-256 before issuing a capability URL. Host paths and owner bearer tokens are never placed in the player URL.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewWebEmulationSession'}}}
      responses:
        '201': {description: Short-lived browser-play session, content: {application/json: {schema: {$ref: '#/components/schemas/WebEmulationSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /web-emulation/content/{token}/{name}:
    get:
      operationId: getWebEmulationContentByTokenByName
      tags: [Runtime]
      summary: Stream the verified ROM for a short-lived browser-play session
      description: The signed path capability is bound to Edition, Artifact, SHA-256, and expiry. Range requests are supported; changed or missing content returns no ROM bytes.
      security: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: Range, in: header, schema: {type: string}}
      responses:
        '200': {description: Complete verified ROM content, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '206': {description: Verified ROM byte range, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /web-emulation/saves/{token}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
    get:
      operationId: getWebEmulationSavesByToken
      tags: [Saves]
      summary: Restore the current save for a signed browser-play session
      security: []
      responses:
        '200':
          description: Current core-isolated battery save
          headers:
            X-Varkiv-Revision: {schema: {type: string}, description: Revision to send as the base of the next upload}
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        '204': {description: The stream has no save revision yet}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      operationId: postWebEmulationSavesByToken
      tags: [Saves]
      summary: Add an automatic core-isolated save revision
      description: The signed play capability selects Edition, exact EmulatorJS core, driver, and SaveStream. A stale base is preserved as a conflict instead of overwriting history.
      security: []
      parameters:
        - {name: X-Varkiv-Base-Revision, in: header, schema: {type: string}}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary, maxLength: 33554432}}}
      responses:
        '201': {description: Immutable save revision created or deduplicated, content: {application/json: {schema: {$ref: '#/components/schemas/SavePushResult'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
  /web-netplay/readiness:
    get:
      operationId: getWebNetplayReadiness
      tags: [Runtime]
      summary: Report the isolated browser-to-browser netplay experiment
      description: Checks the pinned experimental EmulatorJS assets and internal signal sidecar without exposing the upstream address or ICE credentials.
      security: []
      responses:
        '200': {description: Web netplay readiness, content: {application/json: {schema: {$ref: '#/components/schemas/WebNetplayReadiness'}}}}
  /web-netplay/sessions:
    post:
      operationId: postWebNetplaySessions
      tags: [Runtime]
      summary: Create a two-browser WebRTC room for one exact NES Edition
      description: Re-hashes the local ROM, pins the EmulatorJS and core build, disables persistent saves, and returns a one-time invitation code plus a short-lived host player capability.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewWebNetplaySession'}}}}
      responses:
        '201': {description: Host room created, content: {application/json: {schema: {$ref: '#/components/schemas/WebNetplaySession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /web-netplay/sessions/join:
    post:
      operationId: postWebNetplaySessionsJoin
      tags: [Runtime]
      summary: Join a WebRTC room with a matching local Edition
      description: The invitation authorizes only the join attempt. Varkiv independently verifies full ROM SHA-256, size, platform, EmulatorJS version, core, and core build before issuing a guest player capability.
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JoinWebNetplaySession'}}}}
      responses:
        '200': {description: Guest admitted, content: {application/json: {schema: {$ref: '#/components/schemas/WebNetplaySession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runtime-import-hints:
    get:
      operationId: getRuntimeImportHints
      tags: [Runtime]
      summary: List inert runtime suggestions recovered during import
      description: Raw frontend commands are returned for human reference only and are never executed or converted automatically.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: edition_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [pending, applied, dismissed]}}
      responses:
        '200': {description: Paginated runtime import hints, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeImportHintCollection'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /runtime-import-hints/batch/preview:
    post:
      operationId: postRuntimeImportHintsBatchPreview
      tags: [Runtime]
      summary: Preview one declarative launch binding across matching import hints
      description: Validates a bounded same-platform hint set, enabled device/driver/core/frontend definitions, target compatibility, and the absence of an existing binding. The signed preview contains hashes instead of raw imported commands.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeHintBatchRequest'}}}
      responses:
        '200': {description: Signed atomic batch preview, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeHintBatchPreview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runtime-import-hints/batch/commit:
    post:
      operationId: postRuntimeImportHintsBatchCommit
      tags: [Runtime]
      summary: Atomically apply a signed runtime-hint batch
      description: Rechecks every hint, Edition, runtime definition, target, and existing binding in the write transaction. Drift or one conflict creates zero bindings and leaves every unchanged hint pending. Raw imported commands are never executed or copied into argv.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeHintBatchCommit'}}}
      responses:
        '200': {description: Every reviewed hint was applied, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeHintBatchResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runtime-import-hints/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getRuntimeImportHintsById
      tags: [Runtime]
      summary: Get an inert runtime import hint
      responses:
        '200': {description: Runtime import hint, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeImportHint'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /runtime-import-hints/{id}/apply:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: postRuntimeImportHintsByIdApply
      tags: [Runtime]
      summary: Apply a reviewed hint as a declarative launch binding
      description: The submitted argv and catalog IDs are validated. Any raw imported command is deliberately ignored. Binding creation and hint status change are atomic.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewLaunchBinding'}}}
      responses:
        '200': {description: Applied hint and created binding, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeHintApplication'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runtime-import-hints/{id}/dismiss:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: postRuntimeImportHintsByIdDismiss
      tags: [Runtime]
      summary: Dismiss a pending runtime hint without deleting imported content
      responses:
        '200': {description: Dismissed hint, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeImportHint'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /hardware-acceptance/preview:
    post:
      operationId: postHardwareAcceptancePreview
      tags: [Runtime]
      summary: Validate and preview a privacy-minimized real-device acceptance report
      description: The report remains a candidate until an explicit commit. The response omits probe filenames, sync details, paths, device identity, server address, and tokens.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HardwareAcceptanceRequest'}}}}
      responses:
        '200': {description: Sanitized review preview, content: {application/json: {schema: {$ref: '#/components/schemas/HardwareAcceptancePreview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /hardware-acceptance/commit:
    post:
      operationId: postHardwareAcceptanceCommit
      tags: [Runtime]
      summary: Atomically record reviewed real-device support evidence
      description: Requires the signed preview token and the unchanged report selection. Only support level and privacy-minimized evidence are updated; runtime definitions are immutable in this flow.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HardwareAcceptanceRequest'}}}}
      responses:
        '200': {description: Reviewed evidence committed atomically, content: {application/json: {schema: {$ref: '#/components/schemas/HardwareAcceptanceCommitResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /support-readiness:
    get:
      operationId: getSupportReadiness
      tags: [Runtime]
      summary: Read target-specific real-device support readiness gates
      description: Reuses the release audit's reviewed-evidence rules. It never probes devices or opens ROM, media, save, or source paths, and it does not imply public-release approval.
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Privacy-minimized real-device gate summary, content: {application/json: {schema: {$ref: '#/components/schemas/HardwareReadinessReport'}}}}
        '500': {$ref: '#/components/responses/Error'}
  /storage-cleanup/preview:
    post:
      operationId: postStorageCleanupPreview
      tags: [Storage]
      summary: Preview unreferenced files in service-managed ROM and media storage
      description: Scans only the service-managed roots. Referenced library or NAS paths, save blobs, active media staging files, symbolic links, and unsupported file types are never cleanup candidates. The signed token binds the complete candidate set.
      responses:
        '200': {description: Exact reviewable cleanup plan, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedCleanupPreview'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /storage-cleanup/commit:
    post:
      operationId: postStorageCleanupCommit
      tags: [Storage]
      summary: Move selected unreferenced managed files into private recovery storage
      description: Rechecks catalog references under an immediate database lock, verifies the signed preview and every selected file, writes a mode-0600 recovery manifest, then uses same-volume renames. It never deletes file bytes.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedCleanupCommitRequest'}}}}
      responses:
        '201': {description: Files quarantined with a recoverable operation record, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedCleanupRun'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /storage-cleanup/runs:
    get:
      operationId: getStorageCleanupRuns
      tags: [Storage]
      summary: List sanitized managed-storage recovery operations
      description: Returns counts, byte totals, timestamps, and status only. Original filenames and paths remain in the private local recovery manifest and are not exposed by this endpoint.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated recovery operations, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedCleanupRunCollection'}}}}
  /storage-cleanup/runs/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: postStorageCleanupRunsByIdRestore
      tags: [Storage]
      summary: Restore every file from one managed-storage recovery operation
      description: Preflights the complete destination set and refuses the whole restore if any destination is occupied or any recovery payload changed. Repeated restore requests are idempotent.
      responses:
        '200': {description: Restored or already-restored operation, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedCleanupRun'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /devices:
    get:
      operationId: getDevices
      tags: [Devices]
      summary: List registered devices
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated devices, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceCollection'}}}}
    post:
      operationId: postDevices
      tags: [Devices]
      summary: Register a device
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceMutation'}}}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '201': {description: Registered device, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
  /devices/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getDevicesById
      tags: [Devices]
      summary: Get a registered device
      responses:
        '200': {description: Device, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: putDevicesById
      tags: [Devices]
      summary: Replace editable device metadata
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceMutation'}}}}
      responses:
        '200': {description: Updated device, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteDevicesById
      tags: [Devices]
      summary: Delete a device that has no save revisions
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /devices/{id}/revoke:
    post:
      operationId: postDevicesByIdRevoke
      tags: [Devices]
      summary: Revoke a device and every client token issued to it
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Revoked device, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /devices/{id}/heartbeat:
    post:
      operationId: postDevicesByIdHeartbeat
      tags: [Devices]
      summary: Replace the authenticated device runtime snapshot and mark it active
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HeartbeatRequest'}
      responses:
        '200': {description: Active device, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {description: A runtime identity was not requested for this device OS and architecture, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /pairing-codes:
    post:
      operationId: postPairingCodes
      tags: [Devices]
      summary: Issue a single-use, short-lived device pairing code
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairingCodeRequest'}
      responses:
        '201': {description: Pairing code shown once, content: {application/json: {schema: {$ref: '#/components/schemas/PairingCode'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /pairing-codes/redeem:
    post:
      operationId: postPairingCodesRedeem
      tags: [Devices]
      summary: Redeem a pairing code and receive a client bearer token once
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairingRedeemRequest'}
      responses:
        '201': {description: Paired device and one-time plaintext token, content: {application/json: {schema: {$ref: '#/components/schemas/PairingRedeemResponse'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
  /saves:
    get:
      operationId: getSaves
      tags: [Saves]
      summary: List immutable save revisions
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: edition_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated save revisions, content: {application/json: {schema: {$ref: '#/components/schemas/SaveRevisionCollection'}}}}
  /saves/upload:
    post:
      operationId: postSavesUpload
      tags: [Saves]
      summary: Upload a save revision with conflict preservation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, edition_id, device_id, driver_id, relative_path]
              properties:
                file: {type: string, format: binary}
                edition_id: {type: string, format: uuid}
                device_id: {type: string, format: uuid}
                driver_id: {type: string}
                relative_path: {type: string}
                scope_type: {type: string, enum: [game, platform, container]}
                scope_key: {type: string}
                base_revision_id: {type: string, format: uuid}
      responses:
        '201': {description: Save push result, content: {application/json: {schema: {$ref: '#/components/schemas/SavePushResult'}}}}
        '413': {$ref: '#/components/responses/Error'}
  /saves/{id}:
    get:
      operationId: getSavesById
      tags: [Saves]
      summary: Get immutable save revision metadata
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Save revision metadata, content: {application/json: {schema: {$ref: '#/components/schemas/SaveRevision'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /saves/{id}/download:
    get:
      operationId: getSavesByIdDownload
      tags: [Saves]
      summary: Download a save revision
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Save file, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Error'}
  /save-streams:
    get:
      operationId: getSaveStreams
      tags: [Saves]
      summary: List logical save streams shared by one or more Editions
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: edition_id, in: query, schema: {type: string}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated save streams, content: {application/json: {schema: {$ref: '#/components/schemas/SaveStreamCollection'}}}}
    post:
      operationId: postSaveStreams
      tags: [Saves]
      summary: Create a save stream with explicit portability and Edition relationships
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewSaveStream'}}}}
      responses:
        '201': {description: Created stream, content: {application/json: {schema: {$ref: '#/components/schemas/SaveStream'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /save-streams/{id}:
    get:
      operationId: getSaveStreamsById
      tags: [Saves]
      summary: Get a save stream
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Save stream, content: {application/json: {schema: {$ref: '#/components/schemas/SaveStream'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /save-streams/{id}/revisions:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getSaveStreamsByIdRevisions
      tags: [Saves]
      summary: List every immutable revision in a stream
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated revisions, content: {application/json: {schema: {$ref: '#/components/schemas/SaveRevisionCollection'}}}}
    post:
      operationId: postSaveStreamsByIdRevisions
      tags: [Saves]
      summary: Direct multi-file upload for diagnostics; Device Agent uses negotiated sync operations
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [manifest, files], properties: {manifest: {type: string}, files: {type: array, items: {type: string, format: binary}}}}
      responses:
        '201': {description: Save push result, content: {application/json: {schema: {$ref: '#/components/schemas/SavePushResult'}}}}
        '413': {$ref: '#/components/responses/Error'}
  /save-compatibility-groups:
    get:
      operationId: getSaveCompatibilityGroups
      tags: [Saves]
      summary: List versioned exact-runtime save format compatibility groups
      description: Membership is evidence-backed and never inferred from display names. Device members remain inactive until both exact runtime file identities are attested.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated compatibility groups, content: {application/json: {schema: {$ref: '#/components/schemas/SaveCompatibilityGroupCollection'}}}}
  /runtime-attestations:
    get:
      operationId: getRuntimeAttestations
      tags: [Saves]
      summary: List privacy-minimized runtime file identities reported by paired devices
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: device_id, in: query, schema: {type: string}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated runtime attestations, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeAttestationCollection'}}}}
  /save-revisions/{id}:
    get:
      operationId: getSaveRevisionsById
      tags: [Saves]
      summary: Get multi-file revision metadata
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Save revision, content: {application/json: {schema: {$ref: '#/components/schemas/SaveRevision'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /save-revisions/{id}/archive:
    get:
      operationId: getSaveRevisionsByIdArchive
      tags: [Saves]
      summary: Download a verified complete revision snapshot as a ZIP archive (owner only)
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: ZIP containing every save file at its logical relative path, content: {application/zip: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Error'}
  /save-revisions/{id}/files/{file_id}/content:
    get:
      operationId: getSaveRevisionsByIdFilesByFileIdContent
      tags: [Saves]
      summary: Download one file from an immutable revision
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: file_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Save file bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Error'}
  /save-bindings:
    get:
      operationId: getSaveBindings
      tags: [Saves]
      summary: List declarative local save-path bindings
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: edition_id, in: query, schema: {type: string}}
        - {name: device_profile_id, in: query, schema: {type: string}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated bindings, content: {application/json: {schema: {$ref: '#/components/schemas/SaveBindingCollection'}}}}
    post:
      operationId: postSaveBindings
      tags: [Saves]
      summary: Create an allowlisted path-template binding
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewSaveBinding'}}}}
      responses:
        '201': {description: Created binding, content: {application/json: {schema: {$ref: '#/components/schemas/SaveBinding'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /save-bindings/setup:
    post:
      operationId: postSaveBindingsSetup
      tags: [Saves]
      summary: Atomically create a save stream and its first device binding
      description: If either the stream relationship or path template is invalid, neither resource is persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream, binding]
              properties:
                stream: {$ref: '#/components/schemas/NewSaveStream'}
                binding: {$ref: '#/components/schemas/NewSaveBinding'}
      responses:
        '201': {description: Created setup, content: {application/json: {schema: {$ref: '#/components/schemas/SaveSetup'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /save-bindings/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getSaveBindingsById
      tags: [Saves]
      summary: Get a save binding
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Save binding, content: {application/json: {schema: {$ref: '#/components/schemas/SaveBinding'}}}}
    put:
      operationId: putSaveBindingsById
      tags: [Saves]
      summary: Replace a save binding
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewSaveBinding'}}}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Updated binding, content: {application/json: {schema: {$ref: '#/components/schemas/SaveBinding'}}}}
    delete:
      operationId: deleteSaveBindingsById
      tags: [Saves]
      summary: Delete only the binding; save revisions and local device files remain untouched
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '204': {description: Deleted}
  /sync/manifest:
    get:
      operationId: getSyncManifest
      tags: [Sync]
      summary: Get the compact Edition and ROM identity manifest for device clients
      description: Clients match local ROMs to an Edition, then use its stable save_namespace when syncing emulator save files.
      parameters:
        - {$ref: '#/components/parameters/Locale'}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200':
          description: Device sync identity manifest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncManifest'}
  /sync/config:
    get:
      operationId: getSyncConfig
      tags: [Sync]
      summary: Get the authenticated device profile and applicable save bindings
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Device sync configuration, content: {application/json: {schema: {$ref: '#/components/schemas/SyncDeviceConfig'}}}}
  /sync/inventory-matches:
    get:
      operationId: getSyncInventoryMatches
      tags: [Sync]
      summary: List ambiguous ROM identity matches that require an administrator decision
      description: Administrator-only. Responses expose catalog candidates and an opaque inventory record identifier, but never the client-local ROM path, filename, hash, serial, product code, title ID, or opaque client item identity. Paired device tokens are rejected.
      parameters:
        - {$ref: '#/components/parameters/Locale'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: Paginated ambiguous inventory matches, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryMatchReviewCollection'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /sync/inventory-matches/preview:
    post:
      operationId: postSyncInventoryMatchesPreview
      tags: [Sync]
      summary: Preview a manual ROM identity confirmation
      description: Administrator-only. Returns a signed snapshot token binding the inventory identity, candidate set, and selection. No ROM bytes are read and no override is written during preview.
      parameters:
        - {$ref: '#/components/parameters/Locale'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryMatchPreviewRequest'}
      responses:
        '200': {description: Signed confirmation preview, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryMatchPreview'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sync/inventory-matches/commit:
    post:
      operationId: postSyncInventoryMatchesCommit
      tags: [Sync]
      summary: Commit a previewed manual ROM identity confirmation
      description: Administrator-only. Rechecks the ROM identity and complete candidate set before writing a device-scoped override. Identity or candidate drift returns 409. The current inventory record is updated immediately and later sync sessions reuse the confirmation only while the same privacy-minimized identity remains valid.
      parameters:
        - {$ref: '#/components/parameters/Locale'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryMatchCommitRequest'}
      responses:
        '200': {description: Confirmation committed, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryMatchConfirmation'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sync/sessions:
    get:
      operationId: getSyncSessions
      tags: [Sync]
      summary: List recent sessions; paired clients see only their own device
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: device_id, in: query, schema: {type: string}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated sync sessions, content: {application/json: {schema: {$ref: '#/components/schemas/SyncSessionCollection'}}}}
    post:
      operationId: postSyncSessions
      tags: [Sync]
      summary: Negotiate upload, download, conflict, and no-op operations
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyncSessionRequest'}
      responses:
        '201': {description: New session, content: {application/json: {schema: {$ref: '#/components/schemas/SyncSessionEnvelope'}}}}
        '200': {description: Idempotent replay of the same session, content: {application/json: {schema: {$ref: '#/components/schemas/SyncSessionEnvelope'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /sync/sessions/{id}:
    get:
      operationId: getSyncSessionsById
      tags: [Sync]
      summary: Get an owned sync session and immutable operation plan
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Sync session, content: {application/json: {schema: {$ref: '#/components/schemas/SyncSession'}}}}
  /sync/sessions/{id}/inventory:
    get:
      operationId: getSyncSessionsByIdInventory
      tags: [Sync]
      summary: Get privacy-minimized ROM inventory match results
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated inventory matches, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryItemCollection'}}}}
  /sync/sessions/{id}/operations/{operation_id}/upload:
    post:
      operationId: postSyncSessionsByIdOperationsByOperationIdUpload
      tags: [Sync]
      summary: Upload an operation's complete file set; commit occurs only after negotiated hash verification
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: operation_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [manifest, files], properties: {manifest: {type: string}, files: {type: array, items: {type: string, format: binary}}}}
      responses:
        '200': {description: Verified upload committed atomically, content: {application/json: {schema: {$ref: '#/components/schemas/SyncOperationUploadResult'}}}}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /sync/sessions/{id}/operations/{operation_id}/ack:
    post:
      operationId: postSyncSessionsByIdOperationsByOperationIdAck
      tags: [Sync]
      summary: Acknowledge a downloaded set by its canonical content hash
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: operation_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [actual_hash], properties: {actual_hash: {type: string, pattern: '^[a-f0-9]{64}$'}}}
      responses:
        '200': {description: Operation acknowledged, content: {application/json: {schema: {$ref: '#/components/schemas/SyncOperationAckResult'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /sync/sessions/{id}/operations/{operation_id}/files/{file_id}/content:
    get:
      operationId: getSyncSessionsByIdOperationsByOperationIdFilesByFileIdContent
      tags: [Sync]
      summary: Download one file authorized by an owned download operation
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: operation_id, in: path, required: true, schema: {type: string}}
        - {name: file_id, in: path, required: true, schema: {type: string}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Save file bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
  /media:
    get:
      operationId: getMedia
      tags: [Media]
      summary: List game- or edition-scoped media assets
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: game_id, in: query, schema: {type: string, format: uuid}}
        - {name: edition_id, in: query, schema: {type: string, format: uuid}}
        - {name: kind, in: query, schema: {type: string}}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200': {description: Paginated media assets, content: {application/json: {schema: {$ref: '#/components/schemas/MediaAssetCollection'}}}}
  /media/upload:
    post:
      operationId: postMediaUpload
      tags: [Media]
      summary: Upload a content-addressed media asset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: {type: string, format: binary}
                game_id: {type: string, format: uuid}
                edition_id: {type: string, format: uuid}
                kind: {type: string, enum: [cover, box_front, box_back, box_spine, logo, screenshot, title_screen, background, fanart, marquee, bezel, manual, video, music, cartridge, poster, banner, tile, other]}
                locale: {type: string}
                sort_order: {type: integer, minimum: 0}
      responses:
        '201': {description: Created media asset, content: {application/json: {schema: {$ref: '#/components/schemas/MediaAsset'}}}}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
  /media/recheck:
    post:
      operationId: postMediaRecheck
      tags: [Media]
      summary: Recheck scoped media paths and atomically persist availability and identity status without deleting or repairing files
      parameters:
        - {name: game_id, in: query, schema: {type: string, format: uuid}, description: Limit the check to media owned by one game.}
        - {name: edition_id, in: query, schema: {type: string, format: uuid}, description: Limit the check to media owned by one edition; cannot be combined with game_id.}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '200':
          description: Recheck summary
          content:
            application/json:
              schema:
                type: object
                required: [checked, available, missing, changed, unsafe, unverified]
                properties:
                  checked: {type: integer, minimum: 0}
                  available: {type: integer, minimum: 0}
                  missing: {type: integer, minimum: 0}
                  changed: {type: integer, minimum: 0}
                  unsafe: {type: integer, minimum: 0}
                  unverified: {type: integer, minimum: 0}
  /media/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getMediaById
      tags: [Media]
      summary: Get media metadata
      responses:
        '200': {description: Media asset, content: {application/json: {schema: {$ref: '#/components/schemas/MediaAsset'}}}}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: putMediaById
      tags: [Media]
      summary: Update media kind, locale, and ordering without changing ownership or blob content
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaMetadataUpdate'}
      responses:
        '200': {description: Updated media metadata, content: {application/json: {schema: {$ref: '#/components/schemas/MediaAsset'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteMediaById
      tags: [Media]
      summary: Remove the media relationship; blob collection is deferred to GC
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '204': {description: Relationship deleted}
  /media/{id}/content:
    get:
      operationId: getMediaByIdContent
      tags: [Media]
      summary: Verify recorded size and SHA-256 before streaming media content with a hash ETag
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Media content, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '304': {description: Client cache is current}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /media/{id}/thumbnail:
    get:
      operationId: getMediaByIdThumbnail
      tags: [Media]
      summary: Verify the original media identity, then return or create a bounded PNG thumbnail
      description: The original regular file, recorded size, and SHA-256 are verified before every cache hit. Only PNG, JPEG, and GIF sources within the documented byte and pixel limits are decoded. The service-owned cache is replaceable and never hides missing or changed source media.
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: size, in: query, schema: {type: integer, enum: [128, 256, 480, 768], default: 480}, description: Maximum width or height in pixels; images are never enlarged.}
      responses:
        '200': {description: Verified PNG thumbnail, content: {image/png: {schema: {type: string, format: binary}}}}
        '304': {description: Client cache is current; source identity was still verified first}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Owner token or a server-issued device token; device scopes are enforced per route.
  headers:
    RequestID:
      description: Caller-supplied valid request identity or a server-generated identity.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}
    APIVersion:
      description: Stable API path version used for this response.
      schema: {type: string, const: v1}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string}, description: Opaque resource identifier; clients must not infer its shape or ordering.}
    Locale: {name: locale, in: query, schema: {type: string, enum: [zh-CN, zh-TW, ja, en]}, description: Preferred localized title. The resource default remains the fallback.}
    Projection: {name: projection, in: query, schema: {type: string, enum: [full, summary], default: full}, description: "Use summary for list metadata, aggregate artifact state, and an opaque cover reference; fetch the detail resource before editing or launching."}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}, description: Maximum number of records returned in this page.}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: Zero-based record offset in the endpoint's documented stable ordering.}
  requestBodies:
    ImportRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [format, source]
            properties:
              format: {type: string, enum: [pegasus, es-de, varkiv]}
              source: {type: string, description: Relative metadata path inside the library root}
              content_root: {type: string, description: Optional relative ROM directory inside the library root for Pegasus or ES-DE packs that store metadata separately. Media remains relative to the metadata file. This value is bound into the signed preview.}
              runtime_source: {type: string, description: Optional explicit ES-DE es_systems.xml path inside the library root. Commands are imported as inert untrusted review hints and are never executed.}
              platform: {type: string, description: Required for Pegasus and ES-DE; omitted for a neutral v4/v5/v6 manifest because every entry carries its own platform}
              locale: {type: string, enum: [zh-CN, zh-TW, ja, en]}
              rom_storage: {type: string, enum: [reference, copy], default: reference}
              media_storage: {type: string, enum: [copy, reference, ignore], default: copy}
              preview_token: {type: string, description: Required on commit; signed snapshot token returned by preview}
              selected_tokens: {type: array, minItems: 1, uniqueItems: true, items: {type: string}, description: Required on commit; opaque candidate tokens returned by preview}
    ROMImportRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [source, platform]
            properties:
              source: {type: string, description: ROM file or directory path inside the library root}
              platform: {type: string}
              rom_storage: {type: string, enum: [reference, copy], default: reference}
              preview_token: {type: string, description: Required on commit; signed snapshot token returned by preview}
              selected_tokens: {type: array, minItems: 1, uniqueItems: true, items: {type: string}, description: Required on commit; opaque candidate tokens returned by preview}
    LibrarySourceRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, kind]
            properties:
              name: {type: string}
              kind: {type: string, enum: [rom_directory, pegasus, esde, varkiv]}
              source_adapter_id: {type: string, description: Optional versioned adapter reference; defaults to the matching built-in handler}
              root_path: {type: string, description: "Relative ROM directory for rom_directory, or optional separate ROM content root for Pegasus and ES-DE; defaults to the metadata directory for metadata sources"}
              metadata_path: {type: string, description: "Relative metadata file for Pegasus, ES-DE, or neutral Varkiv v4/v5/v6 manifest"}
              runtime_metadata_path: {type: string, description: Optional explicit ES-DE es_systems.xml path; never auto-discovered or executed}
              platform: {type: string, description: "Required except for varkiv, whose entries carry independent platforms"}
              metadata_locale: {type: string, enum: [zh-CN, zh-TW, ja, en, '']}
              rom_storage_policy: {type: string, enum: [reference, copy], default: reference}
              media_storage_policy: {type: string, enum: [copy, reference, ignore], default: copy}
              enabled: {type: boolean, default: true}
    SourceScanCommitRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [preview_token, selected_tokens]
            properties:
              preview_token: {type: string}
              selected_tokens: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    HashPackUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: {type: string, format: binary}
    HashPackCommit:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, preview_token]
            properties:
              file: {type: string, format: binary}
              preview_token: {type: string, description: Signed snapshot returned by hash pack preview}
    HashPackExport:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [source_id, name, license, release]
            properties:
              source_id: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'}
              name: {type: string, maxLength: 200}
              publisher: {type: string, maxLength: 200}
              license: {type: string, maxLength: 200}
              release: {type: string, maxLength: 128}
    EditionCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [game_id, default_title, edition_type]
            properties:
              id: {type: string, format: uuid, description: Optional caller-generated identity}
              game_id: {type: string, format: uuid}
              default_title: {type: string}
              edition_type: {type: string, enum: [original, translation, hack, revision, homebrew, other]}
              version: {type: string}
              languages: {type: array, items: {type: string}}
              author: {type: string}
              serial: {type: string}
              product_code: {type: string}
              title_id: {type: string}
              sort_order: {type: integer}
              titles: {type: object, additionalProperties: {type: string}}
              artifact_path: {type: string, description: Optional existing library-relative ROM file or directory; never persisted when validation or hashing fails}
              artifact_role: {type: string, enum: [rom, disc, executable, patch, dlc, update, other], default: rom}
              disc_index: {type: integer, minimum: 0, maximum: 64}
    PackageProfileRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, frontend, target, output_slug]
            properties:
              name: {type: string}
              frontend: {type: string, enum: [pegasus, es-de]}
              target: {type: string}
              device_profile_id: {type: string, description: Optional canonical reference; server resolves a matching built-in profile when omitted}
              frontend_adapter_id: {type: string, description: Optional canonical reference; server resolves a matching built-in adapter when omitted}
              locale: {type: string, enum: [zh-CN, zh-TW, ja, en], default: zh-CN}
              file_mode: {type: string, enum: [copy, hardlink, reference], default: copy, description: Reference emits metadata-only target-root-relative paths and never serializes server host paths or claims ownership of content bytes}
              output_slug: {type: string, pattern: '^[a-z0-9_-]+$'}
              enabled: {type: boolean, default: true}
              templates: {type: array, items: {$ref: '#/components/schemas/PackageConfigTemplateInput'}}
  responses:
    ImportConflict:
      description: import_preview_stale when the signed snapshot no longer matches; import_batch_conflict when an atomic batch cannot commit; platform_definition_conflict/platform_definition_disabled/platform_key_conflict when a portable custom platform cannot be safely reused or created
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        X-Varkiv-API-Version: {$ref: '#/components/headers/APIVersion'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Error:
      description: Structured API error
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        X-Varkiv-API-Version: {$ref: '#/components/headers/APIVersion'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example:
            error:
              code: invalid_argument
              message: request payload is invalid
              request_id: 40e39da4b75c41c28cf40b9f8de46c48
  schemas:
    CapabilityFeatures:
      type: object
      additionalProperties: false
      required: [rom_scan_preview, import_preview_tokens, atomic_import_batches, missing_rom_detection, inventory_match_confirmation, persistent_sources, source_scan_audit, source_adapters, bounded_source_preview, package_plans, package_release_history, safe_config_templates, unmanaged_output_guard, frontend_adapters, device_profiles, emulator_drivers, retroarch_core_mappings, launch_bindings, runtime_import_review, hardware_acceptance_review, structured_launch_roundtrip, portable_runtime_catalog_v2, portable_builtin_snapshots, reserved_builtin_namespace, neutral_manifest_v5, neutral_manifest_v6, portable_custom_platforms, custom_platforms, edition_grouping, game_merge_preview, cross_platform_series, multilingual_names, save_revisions, multi_file_save_streams, device_pairing, save_bindings, runtime_identity_attestation, verified_cross_driver_saves, sync_negotiation, device_sync_manifest, directory_rom_inventory, managed_roms, media_assets, media_thumbnails, managed_storage_quarantine, managed_storage_restore, hash_pack_import, hash_pack_export, hash_identity_provenance, web_emulation, web_netplay, device_agent]
      properties:
        rom_scan_preview: {type: boolean}
        import_preview_tokens: {type: boolean}
        atomic_import_batches: {type: boolean}
        missing_rom_detection: {type: boolean}
        inventory_match_confirmation: {type: boolean}
        persistent_sources: {type: boolean}
        source_scan_audit: {type: boolean}
        source_adapters: {type: boolean}
        bounded_source_preview: {type: boolean}
        package_plans: {type: boolean}
        package_release_history: {type: boolean}
        safe_config_templates: {type: boolean}
        unmanaged_output_guard: {type: boolean}
        frontend_adapters: {type: boolean}
        device_profiles: {type: boolean}
        emulator_drivers: {type: boolean}
        retroarch_core_mappings: {type: boolean}
        launch_bindings: {type: boolean}
        runtime_import_review: {type: boolean}
        hardware_acceptance_review: {type: boolean}
        structured_launch_roundtrip: {type: boolean}
        portable_runtime_catalog_v2: {type: boolean}
        portable_builtin_snapshots: {type: boolean}
        reserved_builtin_namespace: {type: boolean}
        neutral_manifest_v5: {type: boolean}
        neutral_manifest_v6: {type: boolean}
        portable_custom_platforms: {type: boolean}
        custom_platforms: {type: boolean}
        edition_grouping: {type: boolean}
        game_merge_preview: {type: boolean}
        cross_platform_series: {type: boolean}
        multilingual_names: {type: boolean}
        save_revisions: {type: boolean}
        multi_file_save_streams: {type: boolean}
        device_pairing: {type: boolean}
        save_bindings: {type: boolean}
        runtime_identity_attestation: {type: boolean}
        verified_cross_driver_saves: {type: boolean}
        sync_negotiation: {type: boolean}
        device_sync_manifest: {type: boolean}
        directory_rom_inventory: {type: boolean}
        managed_roms: {type: boolean}
        media_assets: {type: boolean}
        media_thumbnails: {type: boolean}
        managed_storage_quarantine: {type: boolean}
        managed_storage_restore: {type: boolean}
        hash_pack_import: {type: boolean}
        hash_pack_export: {type: boolean}
        hash_identity_provenance: {type: boolean}
        web_emulation: {type: boolean}
        web_netplay: {type: boolean}
        device_agent: {type: boolean}
    CapabilityDocument:
      type: object
      additionalProperties: false
      required: [contract_version, api_version, imports, exports, device_targets, file_modes, rom_import_storage, media_import_storage, media_upload_max_mb, locales, platform_presets, custom_platforms, save_upload_max_mb, features]
      properties:
        contract_version: {type: integer, const: 1}
        api_version: {type: string, const: v1}
        imports: {type: array, uniqueItems: true, items: {type: string, enum: [rom-file, rom-directory, pegasus, es-de, varkiv-v6, varkiv-v5-compatible, varkiv-v4-compatible, varkiv-hashpack-v1]}}
        exports: {type: array, uniqueItems: true, items: {type: string, enum: [pegasus, es-de, varkiv-hashpack-v1]}}
        device_targets: {type: array, uniqueItems: true, items: {type: string, enum: [windows, steamos-bazzite, android, rocknix, darkos, arkos, knulli, muos, onionos, portable]}}
        file_modes: {type: array, uniqueItems: true, items: {type: string, enum: [copy, hardlink, reference]}}
        rom_import_storage: {type: array, uniqueItems: true, items: {type: string, enum: [reference, copy]}}
        media_import_storage: {type: array, uniqueItems: true, items: {type: string, enum: [copy, reference, ignore]}}
        media_upload_max_mb: {type: integer, minimum: 1}
        locales: {type: array, uniqueItems: true, items: {type: string, enum: [zh-CN, zh-TW, ja, en]}}
        platform_presets: {type: integer, minimum: 0}
        custom_platforms: {type: integer, minimum: 0}
        save_upload_max_mb: {type: integer, minimum: 1}
        features: {$ref: '#/components/schemas/CapabilityFeatures'}
    HashSource:
